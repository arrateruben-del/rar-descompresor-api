# URL pública: https://rar-api-ruben.abacusai.cloud  ->  server_name rar-api-ruben.vm.internal
server {
    listen 80;
    server_name rar-api-ruben.vm.internal;
    client_max_body_size 1024m;
    location / {
        proxy_pass http://127.0.0.1:8072;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        add_header Cache-Control "max-age=0, s-maxage=60";
    }
}
